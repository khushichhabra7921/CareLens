# CI: runs on every push and pull request. Needs no secrets and no Groq key.
#   lint     ruff + UTF-8 check
#   test     Postgres 16 service container: schema + fixture load, then every test
#   docker   the image builds, refuses to start without secrets, starts with them
#   codelens CodeLens AI quality report (informational for now, see docs/DECISIONS.md M7)
name: CI

on:
  push:
  pull_request:

# Least privilege for the automatic GITHUB_TOKEN: read the code, nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commit SHAs (a tag like v7 can be moved; a SHA can't).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/check_encoding.py

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: carelens_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # Throwaway values for a database that exists only for this job. Not real secrets.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSLMODE: disable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_DB: carelens_ci
      LOADER_PASSWORD: ci-only-loader-password
      APP_DB_PASSWORD: ci-only-app-password
      ADMIN_API_KEY: ci-only-admin-api-key-0123456789
      NAME_HASH_SALT: ci-only-name-hash-salt-0123456789
      REQUIRE_DB: "1"   # database tests must run here, never skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Create roles, schemas and views
        run: python scripts/db_setup.py
      - name: Load the test fixture (no Java or Synthea needed)
        run: python scripts/load_data.py --csv-dir tests/fixtures/synthea_mini
      - name: Run all tests, with coverage of the privacy and LLM code
        run: >-
          python -m pytest -q
          --cov=app.privacy --cov=app.llm --cov=app.reports --cov=app.template_report
          --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the image
        run: docker build -t carelens:ci .
      - name: The app refuses to start without its secrets
        run: |
          if docker run --rm carelens:ci; then
            echo "::error::the container started without any secrets"; exit 1
          fi
      - name: With secrets it starts; /health says the database is unavailable (none here)
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e APP_DB_PASSWORD=ci-only-app-password \
            -e ADMIN_API_KEY=ci-only-admin-api-key-0123456789 \
            -e NAME_HASH_SALT=ci-only-name-hash-salt-0123456789 \
            -e DB_HOST=127.0.0.1 -e DB_PORT=1 carelens:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o body.json -w "%{http_code}" http://127.0.0.1:8000/health || true)
            [ "$code" != "000" ] && break; sleep 1
          done
          cat body.json; echo
          test "$code" = "503" && grep -q '"database":"unavailable"' body.json
          docker rm -f smoke

  codelens:
    runs-on: ubuntu-latest
    # Informational until CodeLens stops flagging pathlib's "/" as division (docs/DECISIONS.md M7).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check out CodeLens AI at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: khushichhabra7921/CodeLensAI
          ref: 5d87e01a029ee29155d5d0aa9a1428fe5514f11d
          path: codelens-ai
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r codelens-ai/requirements.txt
      - name: Analyse CareLens (no AI, no generated tests)
        run: >-
          python codelens-ai/main.py analyze . --config codelens.yml --skip-ai --skip-tests
          --no-history --no-issue-trends --no-pr-comment --output-dir codelens-report
      - name: Add the quality gate result to the run summary
        if: always()
        run: cat codelens-report/quality_gate.md >> "$GITHUB_STEP_SUMMARY" || true
